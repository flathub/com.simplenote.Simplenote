app-id: com.simplenote.Simplenote
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: simplenote
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-download

modules:
  - name: simplenote
    buildsystem: simple
    build-commands:
      - chmod +x Simplenote.AppImage
      - ./Simplenote.AppImage --appimage-extract
      # Organizzazione file estratti
      - mkdir -p /app/lib/simplenote
      - cp -R squashfs-root/* /app/lib/simplenote/
      - mkdir -p /app/bin
      - ln -s /app/lib/simplenote/simplenote /app/bin/simplenote
      # Icone e Metadati
      - mkdir -p /app/share/icons/hicolor
      - cp -R squashfs-root/usr/share/icons/hicolor/* /app/share/icons/hicolor/
      - install -Dm644 squashfs-root/simplenote.desktop /app/share/applications/com.simplenote.Simplenote.desktop
      - install -Dm644 com.simplenote.Simplenote.appdata.xml /app/share/metainfo/com.simplenote.Simplenote.appdata.xml
      # Configurazione GTK (standard Flathub)
      - install -Dm644 gtk-settings.ini /app/share/gtk-3.0/gtk-settings.ini
    sources:
      - type: file
        path: com.simplenote.Simplenote.appdata.xml
      - type: file
        path: gtk-settings.ini
      - type: file
        only-arches: [x86_64]
        url: https://github.com/Automattic/simplenote-electron/releases/download/v2.24.0/Simplenote-linux-2.24.0-x86_64.AppImage
        dest-filename: Simplenote.AppImage
        sha256: 3c1357d56e8257a03a31676071d3bdcbe8a6ade1e30dc385de18288617939799
      - type: file
        only-arches: [aarch64]
        url: https://github.com/Automattic/simplenote-electron/releases/download/v2.24.0/Simplenote-linux-2.24.0-arm64.AppImage
        dest-filename: Simplenote.AppImage
        sha256: 3c1357d56e8257a03a31676071d3bdcbe8a6ade1e30dc385de18288617939799
